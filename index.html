<title>BEPC Histoire-Géo Guinée</title>

<style>
/* Layout: une colonne type cahier (max 680px), en-tête collant avec retour, écrans empilés ; correction au stylo rouge/vert, dates surlignées au feutre jaune. */
:root{
  --paper:#f7f8fb; --sheet:#ffffff; --line:#e3e8f1; --ink:#15213a; --muted:#5d6a82;
  --red:#cf3a2b; --green:#18855a; --yellow:#ffd94a; --mark:#fff0a8; --blue:#2453c7; --blue-soft:#e8eefc;
  --display:"Chivo","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --mono:"Chivo Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e141f; --sheet:#161f2e; --line:#243146; --ink:#e9eef7; --muted:#9aa7bd;
  --red:#ff6a58; --green:#3cc98a; --yellow:#ffd94a; --mark:#5a4a12; --blue:#7fa2ff; --blue-soft:#1c2a47; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e141f; --sheet:#161f2e; --line:#243146; --ink:#e9eef7; --muted:#9aa7bd;
  --red:#ff6a58; --green:#3cc98a; --yellow:#ffd94a; --mark:#5a4a12; --blue:#7fa2ff; --blue-soft:#1c2a47; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-block:0 40px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:2px solid var(--ink)}
.back{background:none;border:0;padding:6px 8px 6px 0;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:4px}
.top .tt{font-family:var(--display);font-weight:900;font-size:17px;line-height:1.15;flex:1;min-width:0;text-wrap:balance}
.top .timer{font-family:var(--mono);font-weight:700;font-size:16px;padding:4px 8px;background:var(--ink);color:var(--paper);font-variant-numeric:tabular-nums}
.top .timer.low{background:var(--red);color:#fff}

/* home */
.hero{padding:22px 0 18px;display:grid;gap:10px}
.flag{display:flex;height:6px;width:84px}.flag i{flex:1}.flag i:nth-child(1){background:var(--red)}.flag i:nth-child(2){background:var(--yellow)}.flag i:nth-child(3){background:var(--green)}
h1{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(34px,9vw,52px);line-height:.95;letter-spacing:-.02em;text-wrap:balance}
h1 span{background:var(--yellow);color:#15213a;padding:0 .08em}
.sub{margin:0;color:var(--muted);max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sheet);border:1.5px solid var(--line);padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-weight:900;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.seg{display:flex;border:2px solid var(--ink);margin:18px 0 12px}
.seg button{flex:1;background:var(--sheet);border:0;padding:11px 6px;font-weight:700;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.big{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;border:2px solid var(--ink);background:var(--sheet);padding:14px;min-height:96px}
.big b{font-family:var(--display);font-weight:900;font-size:19px;line-height:1.1}
.big span{font-size:14px;color:var(--muted)}
.big.exam{background:var(--ink);color:var(--paper)}.big.exam span{color:color-mix(in srgb,var(--paper) 75%,transparent)}
.big:disabled{opacity:.5;cursor:default}
.lbl{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.chap{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--line);border-left:5px solid var(--line);padding:12px 14px;margin-bottom:8px}
.chap.H{border-left-color:var(--red)}.chap.G{border-left-color:var(--green)}
.chap .n{font-family:var(--mono);font-weight:700;color:var(--muted);font-size:14px;padding-top:2px}
.chap .ct{font-weight:700;line-height:1.25}
.chap .meta{grid-column:2;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--line);max-width:160px}.bar i{display:block;height:100%;background:var(--green)}
.hist{display:grid;gap:6px}
.hist div{display:flex;justify-content:space-between;gap:10px;background:var(--sheet);border:1.5px solid var(--line);padding:8px 12px;font-size:15px}
.hist b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--blue);text-decoration:underline;padding:0;font-size:13px}

/* chapter */
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button{flex:1;background:var(--sheet);border:1.5px solid var(--line);padding:10px 4px;font-weight:700;font-size:15px}
.tabs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.fiche{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fiche li{background:var(--sheet);border:1.5px solid var(--line);padding:11px 14px;line-height:1.5}
mark{background:var(--mark);color:var(--ink);font-family:var(--mono);font-weight:700;font-size:.92em;padding:0 3px}
.start{width:100%;margin-top:14px;background:var(--blue);color:#fff;border:0;padding:15px;font-family:var(--display);font-weight:900;font-size:19px}
.hint{color:var(--muted);font-size:15px;margin:6px 0 0}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;font-size:14px;color:var(--muted);gap:10px}
.prog{flex:1;height:6px;background:var(--line);margin-left:12px;max-width:240px}.prog i{display:block;height:100%;background:var(--ink)}
.tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border:1.5px solid currentColor}
.tag.H{color:var(--red)}.tag.G{color:var(--green)}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(20px,5.2vw,25px);line-height:1.25;margin:6px 0 16px;text-wrap:balance}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--sheet);border:2px solid var(--line);padding:13px 14px;font-size:17px;line-height:1.3}
.opt .k{font-family:var(--mono);font-weight:700;color:var(--muted);flex:none;width:18px}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 14%,var(--sheet))}
.opt.ko{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--sheet));text-decoration:line-through;text-decoration-color:var(--red)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-left:5px solid;background:var(--sheet);font-size:16px}
.fb.ok{border-color:var(--green)}.fb.ko{border-color:var(--red)}
.fb b{display:block;margin-bottom:2px}
.fb.ok b{color:var(--green)}.fb.ko b{color:var(--red)}
.nav{display:flex;gap:8px;margin-top:16px}
.nav button{flex:1;padding:14px;font-weight:700;border:2px solid var(--ink);background:var(--sheet)}
.nav button.pri{background:var(--ink);color:var(--paper)}
.nav button:disabled{opacity:.4;cursor:default}

/* match */
.mgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:8px;margin-top:12px}
.mcol{display:grid;gap:8px;align-content:start}
.mi{text-align:left;background:var(--sheet);border:2px solid var(--line);padding:11px 10px;font-size:15px;line-height:1.25;position:relative;min-height:52px}
.mi.left{font-family:var(--mono);font-weight:700;font-size:14px}
.mi.act{border-color:var(--blue);background:var(--blue-soft)}
.mi.done{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--sheet));cursor:default}
.mi.bad{animation:shake .3s;border-color:var(--red)}
.mi.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--sheet))}
.mi .badge{position:absolute;top:-8px;right:-6px;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;font-weight:700;min-width:22px;height:22px;display:grid;place-items:center;border-radius:11px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* results */
.score{display:flex;align-items:baseline;gap:10px;margin:18px 0 4px}
.score b{font-family:var(--display);font-weight:900;font-size:72px;line-height:.9;font-variant-numeric:tabular-nums}
.score span{font-family:var(--display);font-weight:700;font-size:26px;color:var(--muted)}
.mention{display:inline-block;font-weight:700;padding:3px 10px;color:#fff;background:var(--green);margin-bottom:10px}
.mention.low{background:var(--red)}
.parts{display:grid;gap:6px;margin:12px 0}
.parts div{display:flex;justify-content:space-between;background:var(--sheet);border:1.5px solid var(--line);padding:9px 12px}
.parts b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.corr{display:grid;gap:8px}
.corr div{background:var(--sheet);border:1.5px solid var(--line);border-left:5px solid var(--red);padding:10px 12px;font-size:15px}
.corr .you{color:var(--red);text-decoration:line-through}
.corr .good{color:var(--green);font-weight:700}
.corr p{margin:4px 0 0;color:var(--muted)}
.pick{display:grid;gap:8px;margin-top:12px}
.pick button{text-align:left;background:var(--sheet);border:2px solid var(--line);padding:14px}
.pick button b{display:block;font-family:var(--display);font-size:19px}
.pick button span{font-size:14px;color:var(--muted)}
.pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.box{background:var(--sheet);border:1.5px solid var(--line);padding:14px;margin-top:12px}
.box ol{margin:6px 0 0;padding-left:20px}
.confirm{margin-top:12px;padding:12px 14px;border:2px solid var(--red);background:var(--sheet)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.dots button{width:30px;height:30px;border:1.5px solid var(--line);background:var(--sheet);font-family:var(--mono);font-size:12px;padding:0}
.dots button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dots button.cur{outline:2px solid var(--blue);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>

const CHAPTERS = [

{ id:"h1", m:"H", t:"La révolution industrielle et les progrès du XIXe siècle",

"La révolution industrielle est le passage d’une économie agricole et artisanale à une économie industrielle, fondée sur les machines.",
"Elle commence en Angleterre à la fin du XVIIIe siècle, puis gagne la France, la Belgique, l’Allemagne et les États-Unis.",
"Ses moteurs : le charbon, le fer (puis l’acier), les capitaux des banques, la main-d’œuvre venue des campagnes (exode rural) et les inventions.",
"1769 : James Watt perfectionne la machine à vapeur.",
"1807 : Robert Fulton fait naviguer le premier bateau à vapeur.",
"1825 : première ligne de chemin de fer, Stockton–Darlington (George Stephenson).",
"1837 : Samuel Morse invente le télégraphe électrique.",

"1876 : Graham Bell invente le téléphone. 1879 : Thomas Edison invente la lampe électrique.",
"1885 : Louis Pasteur met au point le vaccin contre la rage.",
"1886 : Carl Benz construit l’automobile à moteur à essence. 1903 : premier vol motorisé des frères Wright.",

"Les ouvriers s’organisent en syndicats et font grève pour obtenir de meilleures conditions de travail.",
"Capitalisme : propriété privée des usines et recherche du profit. Socialisme : propriété collective des moyens de production.",
"Unités nationales : l’Italie s’unifie en 1861 (Rome capitale en 1870) ; l’Empire allemand est proclamé le 18 janvier 1871 à Versailles (Bismarck)."
],
assoc:[["1769","Machine à vapeur de James Watt"],["1825","Premier chemin de fer (Stephenson)"],["1837","Télégraphe de Morse"],["1876","Téléphone de Graham Bell"],["1879","Lampe électrique d’Edison"],["1885","Vaccin contre la rage (Pasteur)"],["1848","Manifeste du Parti communiste"],["1903","Premier vol des frères Wright"],["1871","Proclamation de l’Empire allemand"],["1807","Bateau à vapeur de Fulton"]],
q:[
["Dans quel pays la révolution industrielle a-t-elle commencé ?","L’Angleterre",["La France","L’Allemagne","Les États-Unis"],"Elle débute en Angleterre à la fin du XVIIIe siècle grâce au charbon, au fer et aux capitaux."],

["Qui a inventé la lampe électrique (ampoule) en 1879 ?","Thomas Edison",["Graham Bell","Louis Pasteur","Robert Fulton"],null],
["Louis Pasteur est célèbre pour avoir mis au point en 1885…","le vaccin contre la rage",["la machine à vapeur","le téléphone","l’automobile"],"C’est un exemple de progrès scientifique au service de la santé."],
["Qui a construit la première automobile à moteur à essence en 1886 ?","Carl Benz",["Henry Ford","James Watt","George Stephenson"],null],

["Le système économique fondé sur la propriété privée et la recherche du profit s’appelle…","le capitalisme",["le socialisme","le communisme","le féodalisme"],null],

["L’exode rural désigne…","le départ des paysans vers les villes",["le retour des citadins à la campagne","l’émigration vers l’Amérique","le déplacement des troupeaux"],null],

["Quel homme d’État a réalisé l’unité allemande ?","Otto von Bismarck",["Cavour","Napoléon III","Garibaldi"],"Cavour et Garibaldi sont les artisans de l’unité italienne."],
["Le canal de Suez, inauguré en 1869, relie…","la mer Méditerranée et la mer Rouge",["l’océan Atlantique et l’océan Pacifique","la mer Noire et la Méditerranée","la mer Rouge et l’océan Indien"],"Il raccourcit énormément la route entre l’Europe et l’Asie."],

"Rivalités : crise de Fachoda (1898) entre la France (Marchand) et l’Angleterre (Kitchener) ; guerre des Boers en Afrique du Sud (1899-1902) ; crises marocaines (1905 et 1911).",

"En Basse-Guinée (côte) : royaumes nalou, landouma, baga, soussou… ; contacts anciens avec les commerçants européens (Rivières du Sud).",
"La France installe un poste militaire à Boké en 1866, sur le Rio Nunez."

{ id:"h4", m:"H", t:"La conquête coloniale et les résistances en Guinée",
fiche:[
"Samory Touré naît vers 1830 à Manyambaladougou (région de Kérouané, Haute-Guinée). Il prend le titre d’almamy et fonde l’empire du Wassoulou, capitale Bissandougou.",
"Il crée une armée permanente de sofas, fabrique des armes et achète des fusils en Sierra Leone.",
"1882 : bataille de Woyowayanko, près de Bamako, contre la colonne de Borgnis-Desbordes.",
"28 mars 1886 : traité de Kéniéba-Koura ; Samory cède la rive gauche du Niger. 1887 : traité de Bissandougou (protectorat).",
"1887-1888 : il échoue au siège de Sikasso (royaume de Tiéba). 1891 : le colonel Archinard prend Kankan et Bissandougou.",
"Samory pratique la tactique de la terre brûlée et déplace son empire vers l’est (Kong, Dabakala, actuelle Côte d’Ivoire).",
"29 septembre 1898 : il est capturé à Guélémou par le capitaine Gouraud. Exilé à Ndjolé (Gabon), il y meurt le 2 juin 1900.",
"Fouta-Djalon : protectorat français en 1881. L’almamy Bokar Biro Barry est vaincu et tué à la bataille de Porédaka (novembre 1896).",
"Alfa Yaya Diallo, roi du Labé, est arrêté en 1905 et déporté au Dahomey ; arrêté de nouveau en 1911, il meurt en exil à Port-Étienne (Mauritanie) en 1912.",
"Tierno Aliou, le Wali de Goumba, mène une résistance religieuse en 1911.",
"Basse-Côte : Dinah Salifou Camara, roi des Nalou, est arrêté en 1890, déporté à Saint-Louis du Sénégal, où il meurt en 1897.",
"Guinée forestière : résistance longue et dispersée (Kissi Kaba Keïta, Nzébéla Togba Pivi…) ; la région n’est soumise qu’au début du XXe siècle.",
"Organisation : colonie des Rivières du Sud (1882) ; Conakry chef-lieu (1890) ; nom de « Guinée française » (1891), premier gouverneur Noël Ballay ; intégration à l’AOF (1895).",
"Chemin de fer Conakry–Niger (jusqu’à Kankan) construit de 1900 à 1914.",
"Causes de l’échec des résistances : supériorité de l’armement européen, divisions entre Africains (« diviser pour régner »), trahisons."
],

"Causes profondes : rivalités économiques et coloniales, nationalismes, course aux armements.",

"1916 : batailles de Verdun et de la Somme, très meurtrières.",
"1917 : entrée en guerre des États-Unis (6 avril) ; la Russie, en révolution, se retire (traité de Brest-Litovsk, mars 1918).",
"11 novembre 1918 : armistice signé à Rethondes. Bilan : environ 10 millions de morts.",
"Traité de Versailles (28 juin 1919) : l’Allemagne est jugée responsable, perd ses colonies et doit payer des réparations.",
"Société des Nations (SDN) créée en 1919, siège à Genève, sur proposition du président américain Wilson.",
"Afrique : environ 200 000 soldats d’AOF mobilisés (tirailleurs sénégalais) ; Blaise Diagne chargé du recrutement en 1918 ; les colonies allemandes (Togo, Cameroun…) deviennent des mandats.",

"L’URSS est créée le 30 décembre 1922. Après la mort de Lénine (1924), Staline prend le pouvoir.",
"Crise de 1929 : krach boursier de Wall Street le jeudi 24 octobre 1929 (« jeudi noir »), puis crise mondiale."
],

"Le Nil (environ 6 700 km), plus long fleuve d’Afrique, naît au lac Victoria et se jette dans la Méditerranée par un delta. Barrage d’Assouan (Égypte).",

"L’Afrique compte environ 1,4 milliard d’habitants ; c’est le continent dont la population augmente le plus vite (environ 2,5 % par an).",

"Agriculture : base de l’économie, encore souvent traditionnelle. Cultures vivrières (riz, mil, sorgho, manioc, maïs, fonio) et cultures d’exportation (cacao, café, arachide, coton, thé, hévéa, palmier à huile).",
"La Côte d’Ivoire est le premier producteur mondial de cacao.",

{ id:"g4", m:"G", t:"La Guinée : présentation, structure et relief",
fiche:[
"La République de Guinée couvre 245 857 km². Capitale : Conakry. Elle a environ 300 km de côtes sur l’océan Atlantique.",
"Elle partage ses frontières avec 6 pays : Guinée-Bissau, Sénégal, Mali, Côte d’Ivoire, Liberia et Sierra Leone.",
"Elle s’étend environ entre 7° et 12° de latitude nord, dans la zone intertropicale.",
"Découpage : 4 régions naturelles ; 8 régions administratives (Boké, Conakry, Faranah, Kankan, Kindia, Labé, Mamou, Nzérékoré) ; 33 préfectures.",
"Structure : socle précambrien (granite) recouvert de grès et de sédiments en Basse et Moyenne-Guinée ; gneiss et schistes en Haute-Guinée et Guinée forestière ; alluvions marines sur la côte.",
"Deux régions de plaines (Basse-Guinée et Haute-Guinée) et deux régions montagneuses (Moyenne-Guinée et Guinée forestière).",
"Basse-Guinée (Guinée maritime) : plaine côtière découpée par des estuaires appelés rias ; mangrove ; monts Gangan (Kindia), Kakoulima (Coyah), Benna (Forécariah).",
"Moyenne-Guinée : massif du Fouta-Djalon, vieille montagne aux formes arrondies ; mont Loura (1 538 m, Mali-Yembéring) ; plateaux de bowé (cuirasses latéritiques).",
"Haute-Guinée : plateaux et hautes plaines de savane, drainés par le Niger et ses affluents ; quelques sommets isolés.",
"Guinée forestière : dorsale guinéenne ; monts Simandou (pic de Fon, 1 656 m), Ziama (Macenta) et Nimba (1 752 m, Lola), point culminant de la Guinée.",
"Le mont Nimba (réserve naturelle) est partagé avec la Côte d’Ivoire et le Liberia ; il est classé au patrimoine mondial de l’UNESCO."

{ id:"g5", m:"G", t:"La Guinée : climat, sols, végétation et cours d’eau",

"Climat tropical à deux saisons : saison des pluies (environ mai à octobre) et saison sèche (environ novembre à avril).",
"Deux vents : la mousson, humide, venue de l’océan (sud-ouest), apporte les pluies ; l’harmattan, sec et chaud, venu du Sahara (nord-est), souffle en saison sèche.",
"Basse-Guinée : climat tropical humide (dit guinéen maritime), très pluvieux (Conakry : environ 4 000 mm par an). Végétation : mangrove sur la côte.",
"Moyenne-Guinée : climat foutanien (tropical d’altitude), plus frais ; températures basses à Mali et Dalaba. Végétation : savane, prairies d’altitude, bowé dénudés.",
"Haute-Guinée : climat soudanien, le plus sec et le plus chaud (environ 1 300 à 1 500 mm). Végétation : savane arborée, forêts-galeries.",
"Guinée forestière : climat subéquatorial, longue saison des pluies (environ 8 à 9 mois). Végétation : forêt dense humide (forêt de Ziama, de Diécké).",
"Sols : ferralitiques (les plus répandus), hydromorphes (gorgés d’eau, propices au riz), cuirasses latéritiques ou bowé (stériles), sols forestiers riches en humus.",
"La Guinée est le « château d’eau de l’Afrique de l’Ouest » : de nombreux fleuves y prennent leur source (Niger, Sénégal, Gambie…).",
"Bassin du Niger (Haute-Guinée et Guinée forestière) : le Niger naît sur la dorsale guinéenne (région de Faranah) ; affluents Tinkisso (rive gauche), Niandan, Milo, Sankarani (rive droite). Il arrose Faranah, Kouroussa, Siguiri.",
"Bassin du Sénégal : le Bafing naît près de Mamou et traverse Tougué et Dinguiraye.",
"Gambie : naît près de Labé, traverse le Sénégal et la Gambie. Koliba (Corubal) : coule vers la Guinée-Bissau.",

],

{ id:"g6", m:"G", t:"La Guinée : population et économie",

"Population : 10 523 261 habitants au recensement de 2014 (RGPH) ; environ 14 millions aujourd’hui. Population jeune, en forte croissance.",
"Grands groupes : Soussou (Basse-Guinée), Peuls (Moyenne-Guinée), Malinké (Haute-Guinée), et en Guinée forestière les Kissi, Toma (Loma), Guerzé (Kpellè), Manon…",

"Conakry est la capitale et la plus grande ville ; autres grandes villes : Nzérékoré, Kankan, Kindia, Labé, Boké.",

<script>
(() => {
const $app = document.getElementById('app');
const BY = Object.fromEntries(CHAPTERS.map(c => [c.id, c]));
CHAPTERS.forEach(c => c.q.forEach((q, i) => q.id = c.id + '-' + i));
const ALLQ = CHAPTERS.flatMap(c => c.q.map(q => Object.assign(q, { ch: c.id, m: c.m })));
const QID = Object.fromEntries(ALLQ.map(q => [q.id, q]));
const VOCAB = { H: 'h9', G: 'g7' };
const KEY = 'bepc-gn-hg-v1';
let S = { seen: {}, exams: [] };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (_) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (_) {} };
let tab = 'H';
let timerId = 0;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickN = (a, n) => shuffle(a).slice(0, n);
const mastered = c => c.q.filter(q => S.seen[q.id] && S.seen[q.id].last).length;
const toReview = () => ALLQ.filter(q => S.seen[q.id] && !S.seen[q.id].last);
const record = (q, ok) => { const r = S.seen[q.id] || { ok: 0, ko: 0 }; ok ? r.ok++ : r.ko++; r.last = ok; S.seen[q.id] = r; };
const chapNum = c => CHAPTERS.filter(x => x.m === c.m).indexOf(c) + 1;
function markDates(t) {
  const m = t.match(/^((?:Vers |Après |Avant )?[0-9][0-9 ]*(?:er)?(?: [a-zéû]+)?(?: [0-9]{4})?(?:[-–][0-9]{2,4})?(?: \([^)]*\))?) ?: /);
  if (m && /\d/.test(m[1])) return '<mark>' + esc(m[1]) + '</mark> : ' + esc(t.slice(m[0].length));
  return esc(t).replace(/\b(1[0-9]{3}|20[0-9]{2})\b/g, '<mark>$1</mark>');
}
function stopTimer() { clearInterval(timerId); timerId = 0; }
function top(title, onBack, extra) {
  return `<div class="top">${onBack ? '<button class="back" id="back" aria-label="Retour">← Retour</button>' : ''}<div class="tt">${esc(title)}</div>${extra || ''}</div>`;
}
function bindBack(fn) { const b = document.getElementById('back'); if (b) b.onclick = fn; }
function scrollTop() { window.scrollTo(0, 0); }

/* ---------- Accueil ---------- */
function home() {
  stopTimer();
  const total = ALLQ.length, done = ALLQ.filter(q => S.seen[q.id] && S.seen[q.id].last).length;
  const last = S.exams[S.exams.length - 1], best = S.exams.reduce((m, e) => Math.max(m, e.note), 0);
  const rev = toReview().length;
  const list = CHAPTERS.filter(c => c.m === tab);
  $app.innerHTML = `
  <div class="hero">
    <div class="flag" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>Réussir le <span>BEPC</span> Histoire-Géo</h1>
    <p class="sub">Programme guinéen de 10e année : fiches de dates, quiz par chapitre, exercices d’association comme à l’examen, et examens blancs notés sur 20.</p>
    <div class="stats">
      <div class="stat"><b>${done}/${total}</b><span>questions maîtrisées</span></div>
      <div class="stat"><b>${last ? last.note.toFixed(1).replace('.', ',') : '–'}</b><span>dernier examen /20</span></div>
      <div class="stat"><b>${best ? best.toFixed(1).replace('.', ',') : '–'}</b><span>meilleure note</span></div>
    </div>
  </div>
  <div class="cta">
    <button class="big exam" id="goExam"><b>Examen blanc</b><span>20 questions, 30 min, noté sur 20</span></button>
    <button class="big" id="goRev" ${rev ? '' : 'disabled'}><b>À revoir (${rev})</b><span>${rev ? 'Les questions que tu as ratées' : 'Rien à revoir pour l’instant'}</span></button>
  </div>
  <div class="seg" role="group" aria-label="Matière">
    <button aria-pressed="${tab === 'H'}" data-t="H">Histoire</button>
    <button aria-pressed="${tab === 'G'}" data-t="G">Géographie</button>
  </div>
  ${list.map(c => { const m = mastered(c), p = Math.round(m / c.q.length * 100); return `
    <button class="chap ${c.m}" data-c="${c.id}">
      <span class="n">${String(chapNum(c)).padStart(2, '0')}</span><span class="ct">${esc(c.t)}</span>
      <span class="meta"><span>${c.q.length} questions · ${c.assoc.length} à relier</span><span class="bar"><i style="width:${p}%"></i></span><span>${p}%</span></span>
    </button>`; }).join('')}
  ${S.exams.length ? `<div class="lbl">Mes examens blancs</div><div class="hist">${S.exams.slice(-5).reverse().map(e => `<div><span>${esc(e.date)} · ${esc(e.label)}</span><b>${e.note.toFixed(1).replace('.', ',')}/20</b></div>`).join('')}</div>` : ''}
  <p class="foot">Ta progression est enregistrée sur cet appareil. <button class="linkbtn" id="reset">Remettre à zéro</button></p>
  <div id="resetBox"></div>`;
  $app.querySelectorAll('.seg button').forEach(b => b.onclick = () => { tab = b.dataset.t; home(); });
  $app.querySelectorAll('.chap').forEach(b => b.onclick = () => chapter(BY[b.dataset.c], 'fiche'));
  document.getElementById('goExam').onclick = examSetup;
  document.getElementById('goRev').onclick = () => quiz(shuffle(toReview()).slice(0, 15), 'À revoir', home);
  document.getElementById('reset').onclick = () => {
    document.getElementById('resetBox').innerHTML = `<div class="confirm">Effacer toute ta progression et tes notes ?<div class="nav"><button id="rNo">Annuler</button><button class="pri" id="rYes">Effacer</button></div></div>`;
    document.getElementById('rNo').onclick = home;
    document.getElementById('rYes').onclick = () => { S = { seen: {}, exams: [] }; save(); home(); };
  };
}

/* ---------- Chapitre ---------- */
function chapter(c, view) {
  stopTimer(); scrollTop();
  const head = top((c.m === 'H' ? 'Histoire ' : 'Géographie ') + chapNum(c), home);
  let body = '';
  if (view === 'fiche') body = `<ul class="fiche">${c.fiche.map(f => `<li>${markDates(f)}</li>`).join('')}</ul>
    <button class="start" id="toQuiz">Faire le quiz du chapitre</button>`;
  else if (view === 'quiz') body = `<p class="hint">10 questions tirées au hasard, en priorité celles que tu ne maîtrises pas encore. Correction immédiate.</p>
    <button class="start" id="sQuiz">Commencer le quiz</button>
    <button class="start" id="sAll" style="background:var(--ink)">Toutes les questions (${c.q.length})</button>`;
  else body = `<p class="hint">Relie chaque élément de gauche à celui qui lui correspond, comme dans l’exercice d’association du BEPC. Touche un élément à gauche, puis sa réponse à droite.</p>
    <button class="start" id="sMatch">Commencer</button>`;
  $app.innerHTML = head + `<h2 class="qtext" style="margin-top:16px">${esc(c.t)}</h2>
    <div class="tabs" role="group"><button aria-pressed="${view === 'fiche'}" data-v="fiche">Fiche</button><button aria-pressed="${view === 'quiz'}" data-v="quiz">Quiz</button><button aria-pressed="${view === 'match'}" data-v="match">${c.m === 'H' && c.id !== 'h9' ? 'Dates' : 'Relier'}</button></div>` + body;
  bindBack(home);
  $app.querySelectorAll('.tabs button').forEach(b => b.onclick = () => chapter(c, b.dataset.v));
  const back = () => chapter(c, 'quiz');
  if (view === 'fiche') document.getElementById('toQuiz').onclick = () => chapter(c, 'quiz');
  if (view === 'quiz') {
    document.getElementById('sQuiz').onclick = () => {
      const weak = shuffle(c.q.filter(q => !(S.seen[q.id] && S.seen[q.id].last))), strong = shuffle(c.q.filter(q => S.seen[q.id] && S.seen[q.id].last));
      quiz(weak.concat(strong).slice(0, 10), c.t, back);
    };
    document.getElementById('sAll').onclick = () => quiz(shuffle(c.q), c.t, back);
  }
  if (view === 'match') document.getElementById('sMatch').onclick = () => match(c, () => chapter(c, 'match'));
}

/* ---------- Quiz d'entraînement ---------- */
function quiz(qs, title, onDone) {
  let i = 0, good = 0;
  const show = () => {
    scrollTop();
    const q = qs[i], opts = shuffle([q[1], ...q[2]]);
    $app.innerHTML = top(title, onDone) + `
      <div class="qhead"><span class="tag ${q.m}">${q.m === 'H' ? 'Histoire' : 'Géo'}</span><span>${i + 1} / ${qs.length}</span><span class="prog"><i style="width:${i / qs.length * 100}%"></i></span></div>
      <p class="qtext">${esc(q[0])}</p>
      <div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <div id="fb"></div>`;
    bindBack(onDone);
    const bs = [...$app.querySelectorAll('.opt')];
    bs.forEach(b => b.onclick = () => {
      const pick = opts[+b.dataset.k], ok = pick === q[1];
      record(q, ok); save(); if (ok) good++;
      bs.forEach(x => { x.disabled = true; if (opts[+x.dataset.k] === q[1]) x.classList.add('ok'); });
      if (!ok) b.classList.add('ko');
      document.getElementById('fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'ko'}"><b>${ok ? 'Bonne réponse' : 'Réponse : ' + esc(q[1])}</b>${q[3] ? esc(q[3]) : ''}</div>
        <div class="nav"><button class="pri" id="nx">${i + 1 < qs.length ? 'Question suivante' : 'Voir mon résultat'}</button></div>`;
      document.getElementById('nx').onclick = () => { i++; i < qs.length ? show() : end(); };
      document.getElementById('nx').focus();
    });
  };
  const end = () => {
    scrollTop();
    const n = Math.round(good / qs.length * 20 * 10) / 10;
    $app.innerHTML = top(title, onDone) + `
      <div class="score"><b>${good}</b><span>/ ${qs.length}</span></div>
      <span class="mention ${n < 10 ? 'low' : ''}">${n >= 16 ? 'Excellent' : n >= 12 ? 'Bien' : n >= 10 ? 'Passable' : 'À retravailler'}</span>
      <p class="hint">Les questions ratées sont ajoutées à « À revoir » sur l’accueil.</p>
      <div class="nav"><button class="pri" id="again">Recommencer</button><button id="out">Terminer</button></div>`;
    bindBack(onDone);
    document.getElementById('again').onclick = () => quiz(shuffle(qs), title, onDone);
    document.getElementById('out').onclick = onDone;
  };
  if (!qs.length) return onDone();
  show();
}

/* ---------- Association ---------- */
function uniquePairs(pairs, n) {
  const L = new Set(), R = new Set(), out = [];
  for (const p of shuffle(pairs)) { if (L.has(p[0]) || R.has(p[1])) continue; L.add(p[0]); R.add(p[1]); out.push(p); if (out.length === n) break; }
  return out;
}
function matchBoard(container, pairs, mode, onChange) {
  // mode 'train' : vérification immédiate ; 'exam' : réponses libres, notées à la fin
  const rights = shuffle(pairs.map(p => p[1]));
  const ans = {}; let sel = null;
  const render = () => {
    container.innerHTML = `<div class="mgrid"><div class="mcol">${pairs.map((p, i) => {
      const done = mode === 'train' && ans[i] !== undefined;
      return `<button class="mi left ${sel === i ? 'act' : ''} ${done ? 'done' : ''}" data-l="${i}">${esc(p[0])}${mode === 'exam' && ans[i] !== undefined ? `<span class="badge">${i + 1}</span>` : ''}</button>`; }).join('')}</div>
      <div class="mcol">${rights.map((r, j) => {
        const li = Object.keys(ans).find(k => ans[k] === j);
        const done = mode === 'train' && li !== undefined;
        return `<button class="mi ${done ? 'done' : ''}" data-r="${j}">${esc(r)}${mode === 'exam' && li !== undefined ? `<span class="badge">${+li + 1}</span>` : ''}</button>`; }).join('')}</div></div>`;
    container.querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
      const i = +b.dataset.l; if (mode === 'train' && ans[i] !== undefined) return;
      sel = sel === i ? null : i; render();
    });
    container.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
      const j = +b.dataset.r; if (sel === null) return;
      if (mode === 'train') {
        if (Object.values(ans).includes(j)) return;
        if (rights[j] === pairs[sel][1]) { ans[sel] = j; sel = null; render(); onChange && onChange(Object.keys(ans).length, 0); }
        else { b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); onChange && onChange(Object.keys(ans).length, 1); }
      } else {
        for (const k in ans) if (ans[k] === j) delete ans[k];
        ans[sel] = j; sel = null; render(); onChange && onChange(Object.keys(ans).length, 0);
      }
    });
  };
  render();
  return { score: () => pairs.reduce((s, p, i) => s + (ans[i] !== undefined && rights[ans[i]] === p[1] ? 1 : 0), 0),
           given: i => ans[i] !== undefined ? rights[ans[i]] : null };
}
function match(c, onDone) {
  scrollTop();
  const pairs = uniquePairs(c.assoc, Math.min(6, c.assoc.length));
  let errors = 0;
  $app.innerHTML = top('Relier · ' + c.t, onDone) + `<div class="qhead"><span>Paires trouvées : <b id="cnt">0</b> / ${pairs.length}</span><span>Erreurs : <b id="err">0</b></span></div><div id="mb"></div><div id="mend"></div>`;
  bindBack(onDone);
  matchBoard(document.getElementById('mb'), pairs, 'train', (n, e) => {
    errors += e; document.getElementById('cnt').textContent = n; document.getElementById('err').textContent = errors;
    if (n === pairs.length) {
      document.getElementById('mend').innerHTML = `<div class="fb ok"><b>${errors === 0 ? 'Sans faute !' : 'Terminé'}</b>${errors} erreur${errors > 1 ? 's' : ''} en chemin.</div>
        <div class="nav"><button class="pri" id="mAgain">Nouvelle série</button><button id="mOut">Terminer</button></div>`;
      document.getElementById('mAgain').onclick = () => match(c, onDone);
      document.getElementById('mOut').onclick = onDone;
    }
  });
}

/* ---------- Examen blanc ---------- */
let examKind = 'HG';
function examSetup() {
  stopTimer(); scrollTop();
  const K = [['HG', 'Histoire et géographie', '10 définitions et questions de cours de chaque matière, 5 dates à relier'],
             ['H', 'Histoire seulement', 'Définitions, questions de cours, dates à relier'],
             ['G', 'Géographie seulement', 'Définitions, questions de cours, éléments à relier']];
  $app.innerHTML = top('Examen blanc', home) + `
    <h2 class="qtext" style="margin-top:16px">Prépare-toi comme le jour du BEPC</h2>
    <div class="pick" role="group">${K.map(k => `<button aria-pressed="${examKind === k[0]}" data-k="${k[0]}"><b>${k[1]}</b><span>${k[2]}</span></button>`).join('')}</div>
    <div class="box"><b>Barème sur 20</b><ol>
      <li>Partie I – Définitions : 5 questions × 1 point</li>
      <li>Partie II – Questions de cours : 10 questions × 1 point</li>
      <li>Partie III – Exercice d’association : 5 paires × 1 point</li></ol>
      <p class="hint">Durée : 30 minutes. Pas de correction pendant l’épreuve : tu peux revenir sur tes réponses avant de rendre ta copie.</p></div>
    <button class="start" id="go">Commencer l’examen</button>`;
  bindBack(home);
  $app.querySelectorAll('.pick button').forEach(b => b.onclick = () => { examKind = b.dataset.k; examSetup(); });
  document.getElementById('go').onclick = () => exam(examKind);
}
function exam(kind) {
  const subj = kind === 'HG' ? ['H', 'G'] : [kind];
  const course = m => ALLQ.filter(q => q.m === m && q.ch !== VOCAB[m]);
  let defs, cours, pairs;
  if (kind === 'HG') {
    defs = pickN(BY.h9.q, 3).concat(pickN(BY.g7.q, 2));
    cours = pickN(course('H'), 5).concat(pickN(course('G'), 5));
    pairs = uniquePairs(CHAPTERS.filter(c => c.m === 'H' && c.id !== 'h9').flatMap(c => c.assoc), 5);
  } else {
    defs = pickN(BY[VOCAB[kind]].q, 5);
    cours = pickN(course(kind), 10);
    pairs = uniquePairs(CHAPTERS.filter(c => c.m === kind && c.id !== VOCAB[kind]).flatMap(c => c.assoc), 5);
  }
  const items = defs.map(q => ({ part: 1, q })).concat(cours.map(q => ({ part: 2, q })));
  items.forEach(it => it.opts = shuffle([it.q[1], ...it.q[2]]));
  const answers = {}; let i = 0, board = null, confirming = false;
  const end = Date.now() + 30 * 60 * 1000;
  const label = kind === 'HG' ? 'Histoire-Géo' : kind === 'H' ? 'Histoire' : 'Géographie';
  const N = items.length + 1;
  const tick = () => {
    const left = Math.max(0, end - Date.now()), el = document.getElementById('tm');
    if (el) { el.textContent = String(Math.floor(left / 60000)).padStart(2, '0') + ':' + String(Math.floor(left / 1000) % 60).padStart(2, '0'); el.classList.toggle('low', left < 120000); }
    if (left <= 0) finish();
  };
  const dots = () => `<div class="dots">${Array.from({ length: N }, (_, k) => `<button class="${(k < items.length ? answers[k] !== undefined : false) ? 'on' : ''} ${k === i ? 'cur' : ''}" data-d="${k}" aria-label="Question ${k + 1}">${k < items.length ? k + 1 : 'III'}</button>`).join('')}</div>`;
  const show = () => {
    scrollTop(); confirming = false;
    const head = top('Examen blanc · ' + label, null, '<span class="timer" id="tm">30:00</span>');
    if (i < items.length) {
      const it = items[i];
      $app.innerHTML = head + `
        <div class="qhead"><span>Partie ${it.part === 1 ? 'I – Définitions' : 'II – Questions de cours'}</span><span>${i + 1} / ${N}</span></div>
        <p class="qtext">${esc(it.q[0])}</p>
        <div class="opts">${it.opts.map((o, k) => `<button class="opt ${answers[i] === k ? 'sel' : ''}" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <div class="nav"><button id="pv" ${i ? '' : 'disabled'}>Précédente</button><button class="pri" id="nx">Suivante</button></div>${dots()}`;
      $app.querySelectorAll('.opt').forEach(b => b.onclick = () => { answers[i] = +b.dataset.k; $app.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === b)); $app.querySelector(`.dots [data-d="${i}"]`).classList.add('on'); });
    } else {
      $app.innerHTML = head + `
        <div class="qhead"><span>Partie III – Association</span><span>${N} / ${N}</span></div>
        <p class="qtext">${kind === 'G' ? 'Relie chaque élément à ce qui lui correspond.' : 'Relie chaque date à l’événement qui lui correspond.'}</p>
        <p class="hint">Touche un élément à gauche, puis sa réponse à droite. Tu peux changer d’avis.</p>
        <div id="mb"></div>
        <div class="nav"><button id="pv">Précédente</button><button class="pri" id="nx">Rendre ma copie</button></div><div id="cf"></div>${dots()}`;
      if (!board) board = { pairs, holder: document.createElement('div') };
      document.getElementById('mb').replaceWith(board.holder);
      if (!board.api) board.api = matchBoard(board.holder, pairs, 'exam');
    }
    tick();
    document.getElementById('pv').onclick = () => { if (i) { i--; show(); } };
    document.getElementById('nx').onclick = () => {
      if (i < items.length) { i++; show(); return; }
      const missing = items.length - Object.keys(answers).length;
      document.getElementById('cf').innerHTML = `<div class="confirm">${missing ? `<b>${missing} question${missing > 1 ? 's' : ''} sans réponse.</b> ` : ''}Rendre ta copie maintenant ?<div class="nav"><button id="cN">Continuer</button><button class="pri" id="cY">Rendre</button></div></div>`;
      document.getElementById('cN').onclick = () => { document.getElementById('cf').innerHTML = ''; };
      document.getElementById('cY').onclick = finish;
    };
    $app.querySelectorAll('.dots button').forEach(b => b.onclick = () => { i = +b.dataset.d; show(); });
  };
  let finished = false;
  const finish = () => {
    if (finished) return; finished = true; stopTimer(); scrollTop();
    let p1 = 0, p2 = 0; const errs = [];
    items.forEach((it, k) => {
      const ok = answers[k] !== undefined && it.opts[answers[k]] === it.q[1];
      record(it.q, ok);
      if (ok) it.part === 1 ? p1++ : p2++;
      else errs.push({ q: it.q, you: answers[k] !== undefined ? it.opts[answers[k]] : null });
    });
    if (!board) { board = { holder: document.createElement('div') }; board.api = matchBoard(board.holder, pairs, 'exam'); }
    const p3 = board.api.score();
    const note = p1 + p2 + p3;
    const d = new Date();
    S.exams.push({ date: d.toLocaleDateString('fr-FR'), label, note }); save();
    const mention = note >= 16 ? 'Très bien' : note >= 14 ? 'Bien' : note >= 12 ? 'Assez bien' : note >= 10 ? 'Passable' : 'Insuffisant';
    const pairErr = pairs.map((p, k) => ({ p, g: board.api.given(k) })).filter(x => x.g !== x.p[1]);
    $app.innerHTML = top('Résultat · ' + label, home) + `
      <div class="score"><b>${note}</b><span>/ 20</span></div>
      <span class="mention ${note < 10 ? 'low' : ''}">${mention}</span>
      <div class="parts">
        <div><span>Partie I – Définitions</span><b>${p1} / 5</b></div>
        <div><span>Partie II – Questions de cours</span><b>${p2} / 10</b></div>
        <div><span>Partie III – Association</span><b>${p3} / 5</b></div>
      </div>
      ${errs.length || pairErr.length ? `<div class="lbl">Correction de tes erreurs</div><div class="corr">
        ${errs.map(e => `<div>${esc(e.q[0])}<br>${e.you ? `<span class="you">${esc(e.you)}</span> → ` : '<i>Pas de réponse</i> → '}<span class="good">${esc(e.q[1])}</span>${e.q[3] ? `<p>${esc(e.q[3])}</p>` : ''}</div>`).join('')}
        ${pairErr.map(x => `<div><b>${esc(x.p[0])}</b><br>${x.g ? `<span class="you">${esc(x.g)}</span> → ` : '<i>Non relié</i> → '}<span class="good">${esc(x.p[1])}</span></div>`).join('')}
      </div>` : '<div class="fb ok"><b>Copie parfaite !</b>Aucune erreur.</div>'}
      <div class="nav"><button class="pri" id="again">Nouvel examen</button><button id="out">Accueil</button></div>`;
    bindBack(home);
    document.getElementById('again').onclick = () => exam(kind);
    document.getElementById('out').onclick = home;
  };
  show();
  timerId = setInterval(tick, 1000);
}

home();
})();
</script>
